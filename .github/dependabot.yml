version: 2
# A 7 day cooldown delays adoption of brand-new releases, which limits exposure to a
# compromised upstream release. Security updates are not delayed by the cooldown.
updates:
  - package-ecosystem: pip
    directories: ["/app", "/update-signing"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/update-signing", "/infra/jenkins"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Dockerfile.naive is the fixed baseline for the before and after table in docs/hardening.md.
    ignore:
      - dependency-name: "python"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
